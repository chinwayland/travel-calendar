name: Refresh and deploy travel calendar

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test calendar parser
        run: pnpm test

      - name: Download private calendar feed
        env:
          TRIPIT_ICAL_URL: ${{ secrets.TRIPIT_ICAL_URL }}
        run: |
          test -n "$TRIPIT_ICAL_URL"
          curl --fail --show-error --silent --location \
            --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 60 \
            "$TRIPIT_ICAL_URL" \
            --output "$RUNNER_TEMP/tripit.ics"

      - name: Prepare privacy-safe calendar data
        run: node scripts/build-calendar-data.mjs --input "$RUNNER_TEMP/tripit.ics" --output public/calendar-data.json

      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://www.waylandchin.com/${{ github.event.repository.name }}
        run: pnpm build

      - name: Prepare GitHub Pages folder
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: pnpm pages:prepare

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
